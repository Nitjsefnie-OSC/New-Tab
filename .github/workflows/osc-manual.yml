name: New-Tab fork CI

# Fork-only exact-ref validation. This file exists only on the fork; it is
# intentionally not sent upstream.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git branch, tag, or 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: new-tab-osc-manual-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Nitjsefnie-OSC/New-Tab
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      # Provenance echo, block scalar. The run's head_sha/head_branch report the
      # fork's default branch, so this log line is what proves which commit ran.
      - name: Report checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      # Mirrors upstream ci.yml's single `test` job (npm ci -> lint -> test).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
